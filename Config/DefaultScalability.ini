; The Last Signal - scalability overrides behind the in-game Low / Medium / High / Ultra menu
; (ULastSignalGraphics::ApplyGraphicsPreset maps Low..Ultra onto levels 0..3 and adds a few extra cvars).
; Level 0 = Low (GTX 1660, 1080p / 30 FPS), 2 = High (RTX 3070-class, 1440p / 60 FPS).

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.Quality=0.5
r.Lumen.TraceMeshSDFs=0

[GlobalIlluminationQuality@2]
r.Lumen.ScreenProbeGather.Quality=1
r.Lumen.HardwareRayTracing=1

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2

[ShadowQuality@0]
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.5
r.Shadow.Virtual.MaxPhysicalPages=2048

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.VolumetricFog=0
r.DepthOfFieldQuality=1

[PostProcessQuality@2]
r.VolumetricFog=1
r.DepthOfFieldQuality=2

[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6
