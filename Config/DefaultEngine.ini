[/Script/Engine.RendererSettings]
; Lumen GI + reflections, virtual shadow maps, distance fields (needed by Lumen)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
; Temporal Super Resolution (anti-aliasing + upscaling for the presets' screen percentage)
r.AntiAliasingMethod=4
; physically based auto exposure over the full luminance range (needed for real sun / moon / lamp intensities)
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.MotionBlur=True
; volumetric fog so lamp and headlight beams show in the air
r.VolumetricFog=1
r.SkyAtmosphere=1
r.SupportSkyAtmosphere=True
r.Shadow.Virtual.Enable=1
r.Lumen.TraceMeshSDFs=1

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.CollisionProfile]
; ECC_GameTraceChannel1 = Cover (trace), ECC_GameTraceChannel2 = Vehicle (object)
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Cover")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Vehicle")

[/Script/Engine.StreamingSettings]
; GTX 1660 has 6 GB: keep the texture pool modest
r.Streaming.PoolSize=3000
